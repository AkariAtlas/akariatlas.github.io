<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akari Atlas · Tester checklist</title><link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F7F2E8;color:#343B3B;font:16px/1.5 Quicksand,sans-serif}main{max-width:720px;margin:auto;padding:20px}h1,h2{font-family:'Kaisei Decol',serif;color:#28546B}h2{margin:22px 0 6px;font-size:20px}
.t{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;background:#fff;border-radius:14px;padding:10px 12px;margin:6px 0;box-shadow:0 2px 8px #28546b14}.t small{color:#6b7575}
.r{display:flex;gap:6px;margin-top:4px}.r button{border:1px solid #c9d6dc;background:#fff;border-radius:999px;padding:4px 12px;font:700 13px Quicksand;cursor:pointer}.r button.on.ok{background:#9CAF88;color:#fff;border-color:#9CAF88}.r button.on.bad{background:#E98B73;color:#fff;border-color:#E98B73}.r button.on.na{background:#ddd}
textarea,input,select{width:100%;box-sizing:border-box;border:1px solid #c9d6dc;border-radius:10px;padding:8px;font:15px Quicksand;margin-top:4px}.go{background:#28546B;color:#fff;border:none;border-radius:999px;padding:12px 20px;font:700 15px Quicksand;cursor:pointer;margin:6px 6px 0 0}
.bar{position:sticky;top:0;background:#F7F2E8;padding:8px 0;z-index:2}.p{height:8px;border-radius:6px;background:#e3dccd;overflow:hidden}.p i{display:block;height:100%;background:#9CAF88;width:0}</style></head><body><main>
<p><a href="./">← Back to Akari Atlas</a></p><h1>🧪 Tester checklist</h1>
<p>Thank you for testing! Try each task on your phone, tap <b>✅ Works</b>, <b>❌ Problem</b> (add a note) or <b>– Skip</b>. At the end, tap <b>Send results</b>. Takes about 20 minutes.</p>
<label>Your name<input id="who" placeholder="e.g. Daichi"></label><label>Device<select id="dev"><option>iPhone · Safari</option><option>iPhone · installed app</option><option>Android · Chrome</option><option>Android · APK</option><option>Mac / PC</option></select></label>
<div class="bar"><div class="p"><i id="pg"></i></div><small id="pc"></small></div><div id="list"></div>
<h2>Anything else?</h2><textarea id="extra" rows="4" placeholder="What confused you? What did you love? What’s missing?"></textarea>
<button class="go" onclick="send()">📤 Send results</button><button class="go" style="background:#9CAF88" onclick="copy()">📋 Copy results</button><button class="go" style="background:#ccc;color:#333" onclick="if(confirm('Clear all answers?')){localStorage.removeItem('ak_test');location.reload()}">Reset</button>
<script>
const T={'Getting started':['Open the link: the loading scene plays and an install card appears','Install the app (Add to Home Screen / Install app) and open it from your home screen','Follow the welcome screens, then "Show me around" tour','Add your trip: Gmail import OR paste/upload a booking email or e-ticket','Check the flights, dates and stay are right, then Save'],
'Today':['Countdown, live exchange rate and animated weather show in the header','"What’s next" shows your first/next stop with a Directions button','Tap 🔈: weather is spoken in a warm female voice'],
'Explore':['Search "Taipei 101" and open it','Type "cafe near me" (allow location): nearby cafés with distances appear','Type a full street address: it finds the place','Type "where to buy pineapple cake around Ximending"','Open a café from the list: travel times, ⭐ Reviews & hours and 🧭 Directions work','In Directions, start from your stay, swap, and see walk/bike/MRT/taxi times','Tap 💆 Spas or 🚻 Restrooms or 🏧 ATMs','Search a far place (e.g. Sun Moon Lake): day trip vs overnight advice appears','Add a 🧩 mini-route to a day'],
'Plan':['Tap ✨ Suggest itinerary: every day fills with timed stops','Each day shows times, travel legs, budget, and "Back to your stay"','Edit, move or remove a stop: times update','Download the itinerary PDF (Immigration mode) and open it'],
'Money & Trip':['Log an expense; the spending bar and split update','Use the currency converter','Open 🧳 Trip → What to wear: outfits for each traveller','Add a photo to the 🔐 Wallet and reopen it offline (airplane mode)','Turn on 🔔 Reminders'],
'Translator':['Tap 🗣️, pick the language, tap a phrase: big text + natural voice','Tap "I speak" and say a sentence (allow mic)','Have someone answer with "They speak": you see/hear English'],
'Offline & sync':['Tap ⬇️ Save offline pack, then turn on airplane mode: plan, wallet and maps still open','Share the trip with your companion: changes show on both phones']};
const S=JSON.parse(localStorage.getItem('ak_test')||'{}');const N=Object.values(T).flat().length;
function draw(){let h='',k=0;for(const [g,l] of Object.entries(T)){h+=`<h2>${g}</h2>`;l.forEach(t=>{const id='t'+k++,v=S[id]||{};h+=`<div class="t"><b>${k}.</b><div>${t}<div class="r">${[['ok','✅ Works'],['bad','❌ Problem'],['na','– Skip']].map(([c,l])=>`<button class="${c} ${v.s===c?'on':''}" onclick="set('${id}','${c}')">${l}</button>`).join('')}</div>${v.s==='bad'?`<input placeholder="What happened?" value="${(v.n||'').replace(/"/g,'&quot;')}" oninput="S['${id}'].n=this.value;sv()">`:''}</div></div>`})}
document.getElementById('list').innerHTML=h;const done=Object.values(S).filter(x=>x.s).length;document.getElementById('pg').style.width=done/N*100+'%';document.getElementById('pc').textContent=`${done} of ${N} done`}
function set(id,s){S[id]={...(S[id]||{}),s};sv();draw()}function sv(){localStorage.setItem('ak_test',JSON.stringify(S))}
function report(){let k=0,out=`Akari Atlas test · ${document.getElementById('who').value||'(no name)'} · ${document.getElementById('dev').value}\n${navigator.userAgent}\n\n`;for(const [g,l] of Object.entries(T)){out+=`— ${g}\n`;l.forEach(t=>{const v=S['t'+k++]||{};out+=`${v.s==='ok'?'✅':v.s==='bad'?'❌':v.s==='na'?'–':'·'} ${k}. ${t}${v.n?'  → '+v.n:''}\n`})}
const e=JSON.parse(localStorage.getItem('ak_errlog')||'[]');out+=`\nNotes: ${document.getElementById('extra').value||'-'}\n\nError log (${e.length}):\n`+e.map(x=>`${x.t} ${x.s} ${x.m}`).join('\n');return out}
async function send(){const t=report();try{if(navigator.share)return await navigator.share({title:'Akari Atlas test results',text:t})}catch(e){return}copy()}
async function copy(){try{await navigator.clipboard.writeText(report());alert('Copied! Paste it in a message to Nae.')}catch(e){prompt('Copy:',report())}}
draw();
</script></main></body></html>
